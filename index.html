008: Spatial Planning Analytics | The University of Hong Kong","titlePanelVerticalPosition":"middle","titlePanelHorizontalPosition":"center","titlePanelStyle":"gradient","titlePanelSize":"large"},"config":{"isHidden":false},"children":["n-JkQUf5"]},"n-TD0IFD":{"type":"navigation","data":{"links":[{"nodeId":"n-ZAWOYn","customText":"The Phenomenon"},{"nodeId":"n-IIBwMr","isHidden":true},{"nodeId":"n-Rj0Hl8","customText":"Framework & Approach"},{"nodeId":"n-3k3Gmy","isHidden":true},{"nodeId":"n-FT3v0C","customText":"Current Patterns"},{"nodeId":"n-z3Jk7g","isHidden":true},{"nodeId":"n-wqNd8y"},{"nodeId":"n-wmTQ4N","customText":"Scenario Testing"},{"nodeId":"n-OIcua1"},{"nodeId":"n-gzHRqB"},{"nodeId":"n-YEXzBH"},{"nodeId":"n-qYVPzR"}]},"config":{"isHidden":false}},"n-ZAWOYn":{"type":"text","data":{"type":"h2","text":"The Cross-Border Shopping Phenomenon"}},"n-QgMVLi":{"type":"text","data":{"type":"paragraph","text":"Ever since the resolution of COVID19, many Hong Kongers regularly travel to the neighboring city of Shenzhen to spend their weekends instead of staying in Hong Kong. Wang, D. (2004) found that 62% of respondents go to Shenzhen for shopping, which is more than half of any other travel purpose."}},"n-McNGQL":{"type":"text","data":{"type":"paragraph","text":"Further research discovered that the frequency of travel to Shenzhen varies across origin destinations from Hong Kong — New Territories (NT) residents undertake 1.02 visits/month, those from the Kowloon peninsula visit 0.64 times/month, and Hong Kong Islanders make 0.81 visits/month, indicating that NT residents visit the most frequently."}},"n-Ym50wC":{"type":"text","data":{"type":"h3","text":"The Redevelopment of Huanggang Port"}},"n-alsKRq":{"type":"image","data":{"image":"r-mkHse6","caption":"Cross Border Checkpoint"},"config":{"size":"float","floatAlignment":"end"}},"n-bG1Z8D":{"type":"text","data":{"type":"paragraph","text":"\u003cspan class=\"sm-text-color-000000\">Huanggang Port, Hong Kong’s only 24-hour passenger boarder, is expected to drastically shorten clearance times from 20–30 minutes to under 5 minutes through a new co-location system. This major improvement will \u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>expand the effective shopping catchment for Hong Kong residents \u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">and \u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>shift commercial activity deeper into Shenzhen\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">, challenging the dominance of border-adjacent retail agglomerations such as MixC and Coco Park. \u003c/span>"}},"n-psrx3E":{"type":"text","data":{"text":"","type":"paragraph","textAlignment":"center"}},"n-ciXmiI":{"type":"text","data":{"text":"\u003cspan class=\"sm-text-color-000000\">Huanggang port&apos;s transformation raises important planning questions: \u003c/span>","type":"paragraph","textAlignment":"center"}},"n-Ki7mve":{"type":"text","data":{"text":"Question 1","type":"h3"},"config":{"size":"wide"}},"n-bK3niU":{"type":"text","data":{"text":"Which retail agglomerations will experience the biggest surge in cross-border shoppers?","type":"paragraph"},"config":{"size":"wide"}},"n-uXjh0J":{"type":"timeline-event","children":["n-Ki7mve","n-bK3niU"]},"n-h5s7Tl":{"type":"text","data":{"text":"Question 2","type":"h3"},"config":{"size":"wide"}},"n-939glv":{"type":"text","data":{"text":"Which commercial zones will emerge as new hotspots for future retail development?","type":"paragraph"},"config":{"size":"wide"}},"n-5elctJ":{"type":"timeline-event","children":["n-h5s7Tl","n-939glv"]},"n-X23AdR":{"type":"text","data":{"text":"Question 3","type":"h3"},"config":{"size":"wide"}},"n-ruYB10":{"type":"text","data":{"text":"How should Shenzhen’s government guide land use, retail development, and transport planning to maximize economic benefits while maintaining accessibility? ","type":"paragraph"},"config":{"size":"wide"}},"n-XQcm6l":{"type":"timeline-event","children":["n-X23AdR","n-ruYB10"]},"n-d8N6vu":{"type":"timeline","data":{"type":"waterfall"},"children":["n-uXjh0J","n-5elctJ","n-XQcm6l"]},"n-2xDGOk":{"type":"text","data":{"type":"paragraph","text":""}},"n-IIBwMr":{"type":"text","data":{"text":"Our Objectives","type":"h2"},"config":{"size":"wide"}},"n-l67zfH":{"type":"text","data":{"type":"paragraph","text":"To understand the impact of Huanggang Port&apos;s redevelopment on the retail activity of Hong Kong residents into Shenzhen, we break down this study into three objectives:"},"config":{"size":"wide"}},"n-dmyLPt":{"type":"immersive-narrative-panel","data":{"position":"end","size":"medium","panelStyle":"transparent-with-dark-color"},"children":["n-IIBwMr","n-l67zfH"]},"n-7pBkCa":{"type":"image","data":{"image":"r-yqZ8wf","expressImage":"r-Id5wzy","expressImageDataId":"r-N26KgW"}},"n-C6JF6i":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-dmyLPt","n-7pBkCa"]},"n-OWZn0m":{"type":"text","data":{"text":"I. Analysis of current patterns of behaviour","type":"h3"},"config":{"size":"wide"}},"n-7s4oAB":{"type":"text","data":{"type":"paragraph","text":"First, we identify current attractions and routes for cross-border day-trip shoppers from Hong Kong to Shenzhen, using mobility data and information on retail agglomerations. We also look into the patterns emerging from this mobility data, such as the origin districts of Hong Kongers who make cross-border day trips."},"config":{"size":"wide"}},"n-wHYMrk":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"transparent-with-dark-color"},"children":["n-OWZn0m","n-7s4oAB"]},"n-bAdO92":{"type":"image","data":{"image":"r-yu2vZj"}},"n-OxVNfK":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-wHYMrk","n-bAdO92"]},"n-diDrAa":{"type":"text","data":{"text":"II. Forecast flow changes","type":"h3"},"config":{"size":"wide"}},"n-E490y9":{"type":"text","data":{"type":"paragraph","text":"Secondly, we develop, calibrate and customize a gravity model to predict changes in consumer flows to Shenzhen&apos;s retail agglomerations after Huanggang port&apos;s redevelopment."},"config":{"size":"wide"}},"n-ITVyrO":{"type":"text","data":{"type":"paragraph","text":"With a baseline scenario, we assess three key future scenarios with our gravity model: "},"config":{"size":"wide"}},"n-so22Nq":{"type":"text","data":{"type":"numbered-list","text":"\u003cli>A more efficient Huanggang port\u003c/li>\u003cli>Efficient cross-border checkpoints for all ports\u003c/li>\u003cli>Instant Inter-city Shopping Network\u003c/li>"},"config":{"size":"wide"}},"n-0opeuN":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>This will allow for quantifying the redistribution of consumer flows and identifying new potential hot spots.\u003c/span>"},"config":{"size":"wide"}},"n-rHHLRB":{"type":"immersive-narrative-panel","data":{"position":"start","size":"medium","panelStyle":"themed"},"children":["n-diDrAa","n-E490y9","n-ITVyrO","n-so22Nq","n-0opeuN"]},"n-NiBqPf":{"type":"image","data":{"image":"r-1pjbH4"}},"n-PS0CGs":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-rHHLRB","n-NiBqPf"]},"n-YJ1GqO":{"type":"text","data":{"text":"III. Policy scenario modeling","type":"h3"},"config":{"size":"wide"}},"n-RQOEIa":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>Based on the simulation results, we formulate recommendations for authorities and developers in three key areas:\u003c/span>"},"config":{"size":"wide"}},"n-bHdt4c":{"type":"text","data":{"text":"\u003cli>Smart Border Management &amp; Digital Clearance\u003c/li>\u003cli>Co-planning framework by Shenzhen and Hong Kong\u003c/li>\u003cli>Retail Positioning \u003c/li>","type":"bullet-list"},"config":{"size":"wide"}},"n-ZvovQW":{"type":"immersive-narrative-panel","data":{"position":"start","size":"medium","panelStyle":"themed"},"children":["n-YJ1GqO","n-RQOEIa","n-bHdt4c"]},"n-pZEtNi":{"type":"image","data":{"image":"r-2z7YY4"}},"n-dUUW32":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-ZvovQW","n-pZEtNi"]},"n-UCZaco":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"start","narrativePanelSize":"small"},"children":["n-C6JF6i","n-OxVNfK","n-PS0CGs","n-dUUW32"]},"n-Rj0Hl8":{"type":"text","data":{"type":"h2","text":"Our Framework"}},"n-4jBuec":{"type":"text","data":{"text":"We utilise a framework where we analyse current patterns, simulate scenarios post-Huanggang and provide recommendations for future land use. ","type":"paragraph"}},"n-oWDYfD":{"type":"text","data":{"type":"paragraph","text":""},"config":{"size":"wide"}},"n-LiWBrS":{"type":"text","data":{"text":"Current Pattern Analysis","type":"h3"},"config":{"size":"wide"}},"n-eno2gV":{"type":"text","data":{"text":"First, we collect relevant data such as the trajectory data of cross-border shoppers from Hong Kong, the location of the ports and the shopping areas in Shenzhen. We then visualise them accordingly through heatmaps and flow lines to understand the current patterns.","type":"paragraph"},"config":{"size":"wide"}},"n-1Mqmh4":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed","position":"start"},"children":["n-oWDYfD","n-LiWBrS","n-eno2gV"]},"n-t3dcf3":{"type":"image","data":{"image":"r-THIHpE","isExpandable":true},"config":{"placement":{"type":"fit","fill":{"x":0.5,"y":0.5},"fit":{"color":"backgroundColor"}}}},"n-yMexte":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-1Mqmh4","n-t3dcf3"]},"n-9faR0t":{"type":"text","data":{"text":"Scenario Simulation","type":"h3"},"config":{"size":"wide"}},"n-l4VtdE":{"type":"text","data":{"text":"Next, we simulate 4 different scenarios with our gravity model to observe the flow changes across them.","type":"paragraph"},"config":{"size":"wide"}},"n-Dzn6sd":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed","position":"start"},"children":["n-9faR0t","n-l4VtdE"]},"n-BkUeSU":{"type":"image","data":{"image":"r-DgelvO","isExpandable":true},"config":{"placement":{"type":"fit","fill":{"x":0.5,"y":0.5},"fit":{"color":"backgroundColor"}}}},"n-nYyzt7":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-Dzn6sd","n-BkUeSU"]},"n-tBbecJ":{"type":"text","data":{"text":"Recommendations","type":"h3"},"config":{"size":"wide"}},"n-MRAsBI":{"type":"text","data":{"text":"Finally, we land on three new recommendations for future land use as a result of the observations discovered in Scenario Simulation.","type":"paragraph"},"config":{"size":"wide"}},"n-rkg0Fn":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed","position":"start"},"children":["n-tBbecJ","n-MRAsBI"]},"n-qGJFQG":{"type":"image","data":{"image":"r-QDZSuc","isExpandable":true},"config":{"placement":{"type":"fit","fill":{"x":0.5,"y":0.5},"fit":{"color":"backgroundColor"}}}},"n-ifdfcd":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-rkg0Fn","n-qGJFQG"]},"n-8nK0Qq":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"end","narrativePanelSize":"small"},"children":["n-yMexte","n-nYyzt7","n-ifdfcd"]},"n-HtuKIy":{"type":"text","data":{"type":"paragraph","text":""}},"n-6IfyOZ":{"type":"text","data":{"text":"","type":"paragraph"}},"n-3k3Gmy":{"type":"text","data":{"text":"Our Approach","type":"h2"}},"n-BjINg1":{"type":"image","data":{"image":"r-6stNbh","expressImage":"r-9WdlZT","expressImageDataId":"r-QfX0YT","caption":"Weekend Shoppers"},"config":{"size":"float","floatAlignment":"end"}},"n-SjHq4q":{"type":"text","data":{"text":"In order to create the gravity model to forecast cross-border flow changes into the retail areas of Shenzhen, we first collect mobility data of cross-border shoppers from Hong Kong and factors making a retail area attractive to these shoppers. We also define what a ‘cross-border shopper’, what a ‘retail area’ means and where the border control points are.","type":"paragraph"}},"n-1i6z2R":{"type":"text","data":{"text":"","type":"paragraph"}},"n-Wk0yV1":{"type":"text","data":{"text":"What is considered a retail agglomeration? ","type":"h3"},"config":{"size":"wide"}},"n-4Tf6CO":{"type":"text","data":{"type":"paragraph","text":"Using the provided \u003ccode>ShenzhenAOI2_shopping.csv \u003c/code>dataset, we gather the secondary classes of the Area of Interest (AOI) polygons that are related to retail. A grid cell was classified as a retail grid if these AOIs occupied more than 5% of its total area, a threshold corresponding to a combined commercial buildings footprint of 12,500 square meters. This approach was adopted to account for the granularity of the available data. "},"config":{"size":"wide"}},"n-GZNH2o":{"type":"immersive-narrative-panel","data":{"position":"end","size":"small","panelStyle":"themed"},"children":["n-Wk0yV1","n-4Tf6CO"]},"n-EdzfiW":{"type":"webmap","data":{"caption":"Observed_flows_shopping_3","map":"r-e89e777993aa4d00af8c2846c9fef7d9","timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"19aca86e1ae-layer-4","title":"Sketch","visible":false},{"id":"c788e3d7eba54c90b186f4c257127f50","title":"Cross Border Points","visible":false},{"id":"1a7a321da4ab4da8b00a429adf4bff4f","title":"current_shopping_wit_Project","visible":true}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":12663203.391108764,"ymin":2566549.9877575757,"xmax":12740417.728019735,"ymax":2609972.8495299183},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12701810.55956425,"y":2588261.418643747},"zoom":9.932167792811596,"viewpoint":{"rotation":0,"scale":308491.6814394833,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12701810.55956425,"y":2588261.418643747}}}},"n-n8mAJ9":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-GZNH2o","n-EdzfiW"]},"n-F82d4T":{"type":"text","data":{"text":"Where are the border control points?","type":"h3"},"config":{"size":"wide"}},"n-pw3KRH":{"type":"text","data":{"type":"paragraph","text":"The specific areas representing the cross-border control points were pinpointed by selecting the one to three cells for each port that most frequently appeared as one of the first three locations visited after crossing the border. In the final preprocessing stage, these filtered datasets were merged with demographic data to create a comprehensive dataset for analysis."},"config":{"size":"wide"}},"n-424JaV":{"type":"immersive-narrative-panel","data":{"position":"end","size":"medium","panelStyle":"themed"},"children":["n-F82d4T","n-pw3KRH"]},"n-nMQ7IQ":{"type":"webmap","data":{"caption":"Observed_flows_shopping_3","map":"r-e89e777993aa4d00af8c2846c9fef7d9","timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"19aca86e1ae-layer-4","title":"Sketch","visible":false},{"id":"c788e3d7eba54c90b186f4c257127f50","title":"Cross Border Points","visible":true},{"id":"1a7a321da4ab4da8b00a429adf4bff4f","title":"current_shopping_wit_Project","visible":true}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":12676050.383517673,"ymin":2563294.856825496,"xmax":12748359.812275479,"ymax":2603959.3558732253},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12712205.097896576,"y":2583627.1063493607},"zoom":10,"viewpoint":{"rotation":0,"scale":288895.2771445,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12712205.097896576,"y":2583627.1063493607}}}},"n-kccRfB":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-424JaV","n-nMQ7IQ"]},"n-3qkHUr":{"type":"text","data":{"text":"What makes a cross-border traveller… a shopper? ","type":"h3"},"config":{"size":"wide"}},"n-xhOi6Q":{"type":"text","data":{"type":"paragraph","text":"A trip was identified as having a shopping purpose if it was a single-day journey - without an overnight stay - where the traveler spent a cumulative total of over 1.5 hours within the designated shopping areas."},"config":{"size":"wide"}},"n-xIcZgD":{"type":"immersive-narrative-panel","data":{"position":"end","size":"medium","panelStyle":"themed"},"children":["n-3qkHUr","n-xhOi6Q"]},"n-gARkpC":{"type":"webmap","data":{"caption":"Observed_flows_shopping_3","map":"r-e89e777993aa4d00af8c2846c9fef7d9","timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"19aca86e1ae-layer-4","title":"Sketch","visible":true},{"id":"c788e3d7eba54c90b186f4c257127f50","title":"Cross Border Points","visible":true},{"id":"1a7a321da4ab4da8b00a429adf4bff4f","title":"current_shopping_wit_Project","visible":true}],"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12708308.453842208,"y":2582612.669806317},"zoom":-1}},"n-5slkvO":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-xIcZgD","n-gARkpC"]},"n-vC13y5":{"type":"immersive","data":{"type":"sidecar","subtype":"floating-panel","narrativePanelPosition":"start","narrativePanelSize":"small"},"children":["n-n8mAJ9","n-kccRfB","n-5slkvO"]},"n-xPIoaQ":{"type":"text","data":{"type":"paragraph","text":""}},"n-FT3v0C":{"type":"text","data":{"text":"Current Patterns","type":"h2"},"config":{"size":"wide"}},"n-lR5q6q":{"type":"text","data":{"text":"Travel Purpose","type":"h3"},"config":{"size":"wide"}},"n-YSoddB":{"type":"text","data":{"text":"Based on the mobility data sampled from 20,000 cross border travellers, we found that retail areas are the predominant destination of the cross-border travel from Hong Kong to Shenzhen, constituting 46.6% of all recorded trips. This overwhelming focus on retail activity sharply overshadows other commuting destinations, directly reflected in the spatial behaviours.","type":"paragraph"},"config":{"size":"wide"}},"n-7NU8bM":{"type":"immersive-narrative-panel","data":{"panelStyle":"transparent-with-dark-color","position":"start","size":"small"},"children":["n-FT3v0C","n-lR5q6q","n-YSoddB"]},"n-q4xZTj":{"type":"image","data":{"image":"r-T4fOgu"}},"n-acKxA3":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-7NU8bM","n-q4xZTj"]},"n-BacoTc":{"type":"text","data":{"text":"Furthermore, after adjusting the weights of each trajectory data point, shopping malls are the most frequented points of interest, followed by supermarkets and leisure plazas. The alignment between the stated travel purpose and the distribution of destination categories demonstrates a consistent, purpose-driven pattern of Hongkongers’ cross-border movement. In turn, this creates a distinct spatial pattern concentrated on retail hubs within Shenzhen and the cross-border checkpoints between these two cities.","type":"paragraph"},"config":{"size":"wide"}},"n-wH3GVP":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed","position":"start","size":"small"},"children":["n-BacoTc"]},"n-rSagOW":{"type":"chart","data":{"chart":"r-Er6k4C"}},"n-MbPIV4":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-wH3GVP","n-rSagOW"]},"n-d5IMVr":{"type":"text","data":{"text":"Which Hong Kongers go to Shenzhen?","type":"h3"},"config":{"size":"wide"}},"n-1bjoQN":{"type":"text","data":{"type":"paragraph","text":"According to the official immigration statistics and payment transaction data in 2024, there was a monthly average reaching 6.5 million and an annual total approaching 78 million cross-border movements (Gao, Han, &amp; Song, 2025). In the same year, over 2 million Hong Kong residents actively participated in northbound consumption, meaning roughly one in four (i.e. 26.6%) Hong Kong residents engaged in cross-border shopping."},"config":{"size":"wide"}},"n-lzlojA":{"type":"webmap","data":{"map":"r-37a76925f772463b8549ba18cb9b9028","caption":"shopping_pop_HK","timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":12651251.462942498,"ymin":2526584.615220455,"xmax":12751152.647410518,"ymax":2582765.8310100813},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12701202.055176508,"y":2554675.223115268},"zoom":9.61842105263091,"viewpoint":{"rotation":0,"scale":399131.6328970086,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12701202.055176508,"y":2554675.223115268}}}},"n-HzRO38":{"type":"webmap","data":{"map":"r-37a76925f772463b8549ba18cb9b9028","caption":"shopping_pop_HK","timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":12654858.862054873,"ymin":2526940.4991816655,"xmax":12759498.369804852,"ymax":2585813.4343500873},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12707178.615929862,"y":2556376.9667658764},"zoom":9.61720850684571,"viewpoint":{"rotation":0,"scale":399481.93164767436,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12707178.615929862,"y":2556376.9667658764}}}},"n-nGmY34":{"type":"text","data":{"type":"paragraph","text":"As shown in the map to the right, shopper concentration ratio at the district level in Hong Kong serves as a normalised metric for comparing cross-border shopping propensity with vastly different population densities, implying a spatial-temporal trend that residents who are closer to the \u003cspan data-action-type=\"text-style-action\" id=\"a-n1Ggka\">cross-border points\u003c/span> are more likely to travel to Shenzhen for retail activities."},"config":{"size":"wide"},"dependents":{"actionMedia":["n-lzlojA","n-HzRO38"]}},"n-X3ybvv":{"type":"image","data":{"image":"r-HdQKzN","isExpandable":true},"config":{"placement":{"type":"fit","fill":{"x":0.5497158943338597,"y":0.486727294921875},"fit":{"color":"backgroundColor"}}}},"n-k71ZN5":{"type":"text","data":{"text":"In contrast, cross-border shopping participation reveals significant inter-district heterogeneity, reflecting complex interactions between geographical proximity, socioeconomic characteristics, and urban morphology as shown \u003cspan data-action-type=\"text-style-action\" id=\"a-EcYve0\">here\u003c/span>. Among these, the most pronounced phenomenon occurs in Yau Tsim Mong, where it ranks at the top in terms of both the proportion of consumers and their density of gatherings.","type":"paragraph"},"config":{"size":"wide"},"dependents":{"actionMedia":["n-X3ybvv"]}},"n-2Zir9B":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed","position":"start","size":"small"},"children":["n-d5IMVr","n-1bjoQN","n-nGmY34","n-k71ZN5"]},"n-uUPHBS":{"type":"webmap","data":{"caption":"shopping_pop_HK","map":"r-37a76925f772463b8549ba18cb9b9028","isShowingLegend":true,"timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"19ace675697-layer-9","title":"Sketch","visible":false},{"id":"e89aee9a11f641128bedae4a88f4ff5b","title":"hong_kong_regression_residuals","visible":false},{"id":"02b4506c20ba4d6d9046f6975782364e","title":"hong_kong_standardized_residuals","visible":false},{"id":"59dcf937ecf34e70b47c3aeab2e3c1d6","title":"hong_kong_fitted_shopper_density","visible":false},{"id":"0aca5238f7d2400591038bb852dc3ca9","title":"Ratio_Shopper","visible":true},{"id":"2aff795cb47d42499ba2fc6ddc88814a","title":"Population_Density","visible":false},{"id":"b481aad221a54218b5f143ba08a47460","title":"Shopper_Density","visible":false},{"id":"e542caf548ea42568b0fa848ac7e51ae","title":"hong_kong_complete_regression_results","visible":false}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":12655482.757396467,"ymin":2527450.075555004,"xmax":12755848.948788784,"ymax":2583918.730712096},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12705665.853092626,"y":2555684.40313355},"zoom":9.6736795820065,"viewpoint":{"rotation":0,"scale":383167.70473847835,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12705665.853092626,"y":2555684.40313355}}}},"n-uxgpmc":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-2Zir9B","n-uUPHBS"]},"n-IVpK3K":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativ BERED_TOUR","nodes":[{"long":114.10622152165087,"lat":22.543024514638628}]},"ea26a4b6-b4d4-4183-ae2c-1876fc7bd253":{"id":"ea26a4b6-b4d4-4183-ae2c-1876fc7bd253","type":"POINT_NUMBERED_TOUR","nodes":[{"long":114.05554727752974,"lat":22.5381656772353}]},"5df2a3e7-61c9-4b2c-ab96-75d5197eb976":{"id":"5df2a3e7-61c9-4b2c-ab96-75d5197eb976","type":"POINT_NUMBERED_TOUR","nodes":[{"long":114.1138682533339,"lat":22.547521351483393}]},"7725f96c-d49c-4f99-b138-822b115910dd":{"id":"7725f96c-d49c-4f99-b138-822b115910dd","type":"POINT_NUMBERED_TOUR","nodes":[{"long":114.05534732984894,"lat":22.574873973834002}]}},"mode":"2d","basemap":{"type":"resource","value":"r-0K7gl7"}}},"n-iWQilJ":{"type":"tour","data":{"type":"guided-tour","subtype":"map-focused","narrativePanelPosition":"start","places":[{"id":"n-lY0ALc","featureId":"3d7ba6d9-53bd-4412-8795-ca7f3fcc62b3","contents":[],"media":"n-FDkVW3","title":"n-p6M8hn"},{"id":"n-Sc55Yr","featureId":"ea26a4b6-b4d4-4183-ae2c-1876fc7bd253","contents":["n-spjCah"],"media":"n-ChI099","title":"n-IddyYv"},{"id":"n-7vmjB9","featureId":"5f00b17f-1f31-4af6-a52b-cb710e973f7e","contents":[],"media":"n-KtJewM","title":"n-5IGA55"},{"id":"n-yygmun","featureId":"5df2a3e7-61c9-4b2c-ab96-75d5197eb976","contents":[],"media":"n-oZjVLw","title":"n-O0IOw0"},{"id":"n-pEojqf","featureId":"7725f96c-d49c-4f99-b138-822b115910dd","contents":[],"media":"n-Wf4Xk8","title":"n-YEr1kW"}],"narrativePanelSize":"small","accentColor":"#780000","map":"n-WRpJGu"}},"n-F6dBYN":{"type":"text","data":{"type":"paragraph","text":""}},"n-wqNd8y":{"type":"text","data":{"text":"The Gravity Model","type":"h2"},"config":{"size":"wide"}},"n-930lrX":{"type":"text","data":{"text":"The core of a gravity model is this: customers patronize locations in proportion to the attractiveness of the retail centers and in inverse proportion to their distance. However, we use the Huff Model because the base gravity model by Reilly is for comparing two large cities (Reilly, 1931), while the Huff Model allows for the simultaneous estimation of a shopper’s patronage probabilities for many retail centres (Dolega et al., 2016).   ","type":"paragraph"},"config":{"size":"wide"}},"n-Xul2EW":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-wqNd8y","n-930lrX"]},"n-yEAvys":{"type":"image","data":{"image":"r-DUbC4n","isExpandable":true},"config":{"placement":{"type":"fit","fill":{"x":0.5,"y":0.5},"fit":{"color":"backgroundColor"}}}},"n-B0J4du":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-Xul2EW","n-yEAvys"]},"n-V9euLl":{"type":"text","data":{"text":"Calculating Attractiveness in the Model","type":"h3","textAlignment":"center"},"config":{"size":"wide"}},"n-2yH0JU":{"type":"text","data":{"text":"","type":"paragraph"},"config":{"size":"wide"}},"n-8e9OuN":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-V9euLl","n-2yH0JU"]},"n-onklOM":{"type":"image","data":{"image":"r-yzJ0Op","isExpandable":false},"config":{"placement":{"type":"fit","fill":{"x":0.5,"y":0.5},"fit":{"color":"backgroundColor"}}}},"n-dzwAwH":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-8e9OuN","n-onklOM"]},"n-ieWAOE":{"type":"text","data":{"text":"Expected Travel Cost with Distance Decay","type":"h3","textAlignment":"center"},"config":{"size":"wide"}},"n-bAljXY":{"type":"text","data":{"text":"","type":"paragraph"},"config":{"size":"wide"}},"n-3CwGXk":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-ieWAOE","n-bAljXY"]},"n-GVypvJ":{"type":"image","data":{"image":"r-GLqzig","isExpandable":false},"config":{"placement":{"type":"fit","fill":{"x":0.5,"y":0.5},"fit":{"color":"backgroundColor"}}}},"n-epafty":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-3CwGXk","n-GVypvJ"]},"n-U79X9u":{"type":"text","data":{"text":"Destination Utility and Choice Probability","type":"h3","textAlignment":"center"},"config":{"size":"wide"}},"n-zjtueh":{"type":"text","data":{"text":"Note: Model explains 49.62% variance","type":"paragraph","textAlignment":"center"},"config":{"size":"wide"}},"n-HHpNYR":{"type":"immersive-narrative-panel","data":{"panelStyle":"themed"},"children":["n-U79X9u","n-zjtueh"]},"n-ZXEICA":{"type":"image","data":{"image":"r-kEntNE","isExpandable":true},"config":{"placement":{"type":"fit","fill":{"x":0.5,"y":0.5},"fit":{"color":"backgroundColor"}}}},"n-9TCPnR":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-HHpNYR","n-ZXEICA"]},"n-pUSx6u":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"start","narrativePanelSize":"medium"},"children":["n-B0J4du","n-dzwAwH","n-epafty","n-9TCPnR"]},"n-bkuIl7":{"type":"text","data":{"text":"","type":"paragraph"}},"n-Q2YvI3":{"type":"text","data":{"text":"","type":"paragraph"}},"n-teRcJn":{"type":"text","data":{"type":"paragraph","text":""}},"n-XGBkh3":{"type":"text","data":{"text":"What makes a mall attractive?","type":"h3"},"config":{"size":"wide"}},"n-kJuUpr":{"type":"text","data":{"text":"Think about your last mall choice - was it the parking, the metro access or the stores inside that decided it? Research shows that it’s mostly about what’s inside (Teller &amp; Reutterer, 2008). We break it down into three measurable components; retail tenant mix, visitor ratings and spatial lag. ","type":"paragraph"},"config":{"size":"wide"}},"n-nNaoGw":{"type":"timeline-event","children":["n-XGBkh3","n-kJuUpr"]},"n-tvIa34":{"type":"text","data":{"text":"Retail Tenant Mix","type":"h3"},"config":{"size":"wide"}},"n-vdAOIQ":{"type":"text","data":{"text":"Studies indicate that retail-related factors, i.e. retail tenant mix and merchandise value, exert the most substantial, direct impact on the attractiveness of a retail area. It was also found that accessibility is not a determinant of attractiveness, but it can disqualify a mall from being a desired choice (Teller &amp; Reutterer, 2008). However, as it is unfeasible to determine the retail tenant mix accurately for all retail areas in Shenzhen in a timely manner, we make the assumption that the area of a retail agglomeration is directly proportional to its retail tenant mix, which makes the first of three components of the attractiveness index in the gravity model. ","type":"paragraph"},"config":{"size":"wide"}},"n-fmbKAS":{"type":"timeline-event","children":["n-tvIa34","n-vdAOIQ"]},"n-6U5PLP":{"type":"text","data":{"text":"Visitor Ratings","type":"h3"},"config":{"size":"wide"}},"n-OFqECR":{"type":"text","data":{"text":"Interestingly, neither gastronomy nor entertainment facilities impact the attractiveness of a mall significantly, but environmental-related factors such as ‘atmosphere’ and ‘cleanliness’ significantly do  (Teller &amp; Reutterer, 2008). As it is difficult to quantify this value objectively (i.e. we can count the number of washrooms but how do we measure the quality of each washroom?), we intended to perform a sentiment analysis on reviews of each shopping area. However, as this is somewhat unfeasible as it would require us to scrape thousands of retail zones and reviews per shopping mall, we simply took the overall rating on Google Maps of each mall in the study area and normalised the values as most malls were within the range of 2.8 to 5.0 stars. As Google Maps ratings may reflect the perspectives of only a subset of the cross-border traveller preferences, they provide the most accessible cross-mall comparison available.","type":"paragraph"},"config":{"size":"wide"}},"n-aOuxZG":{"type":"timeline-event","children":["n-6U5PLP","n-OFqECR"]},"n-DlZBT0":{"type":"text","data":{"text":"Spatial Lag","type":"h3"},"config":{"size":"wide"}},"n-qDNAkK":{"type":"text","data":{"text":"Drawing on retail psychology research (Oppewal &amp; Holyoake, 2004), we recognise that shoppers don’t just choose individual stores - they choose shopping environments. Larger retail agglomerations offer: one-stop shopping efficiency, greater variety and reduced uncertainty through comparison shopping. Hence, we enhance our attractiveness index by including the direct neighbours’ attractiveness (i.e. each grid cell would have 8 neighbours maximum), in our final calculation. For the calculation of this attractiveness, we take only the average aggregation of retail tenant mix and visitor ratings into consideration. \n","type":"paragraph"},"config":{"size":"wide"}},"n-MP1Z6l":{"type":"timeline-event","children":["n-DlZBT0","n-qDNAkK"]},"n-cjOkZ5":{"type":"timeline","data":{"type":"waterfall"},"children":["n-nNaoGw","n-fmbKAS","n-aOuxZG","n-MP1Z6l"]},"n-wmTQ4N":{"type":"text","data":{"text":"Scenario Testing: What if we change the rules?","type":"h2"},"config":{"size":"wide"}},"n-QeOoXI":{"type":"text","data":{"text":"Scenario 0: Baseline","type":"h3"},"config":{"size":"wide"}},"n-hkuoJR":{"type":"text","data":{"text":"Currently, a portion of travellers from Hong Kong spend up to 30 minutes in clearance time when going to Shenzhen for shopping and leisure. To create a more sustainable and convenient inter-city living pattern, our imagination starts from here. ","type":"paragraph","textSize":"medium","textAlignment":"start"},"config":{"size":"wide"}},"n-TBQwgG":{"type":"text","data":{"text":"","type":"paragraph"},"config":{"size":"wide"}},"n-gWrefI":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"themed"},"children":["n-wmTQ4N","n-QeOoXI","n-hkuoJR","n-TBQwgG"]},"n-sPxYJA":{"type":"embed","data":{"url":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/hmad6n1uvkowf235m476g/keplergl_ftgg354.json?rlkey=3cvxgjsqacswqlw15g84pi928&dl=0","embedType":"link","title":"Large-scale WebGL-powered Geospatial Data Visualization Tool","description":"Kepler.gl is a powerful web-based geospatial data analysis tool. Built on a high performance rendering engine and designed for large-scale data sets.","thumbnailUrl":"https://d1a3f4spazzrp4.cloudfront.net/kepler.gl/kepler.gl-meta-tag.png","providerUrl":"https://kepler.gl","caption":"Large-scale WebGL-powered Geospatial Data Visualization Tool","isEmbedSupported":true,"display":"inline","embedSrc":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/hmad6n1uvkowf235m476g/keplergl_ftgg354.json?rlkey=3cvxgjsqacswqlw15g84pi928&dl=0"}},"n-ixuPrU":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-gWrefI","n-sPxYJA"]},"n-VJObmi":{"type":"text","data":{"text":"Scenario 1: Post-Huanggang port development, 2026","type":"h3"},"config":{"size":"wide"}},"n-lnrHe0":{"type":"text","data":{"text":"\u003cspan class=\"sm-text-color-C22E00\">\u003cstrong>Gain flow\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>|\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-00939C\">\u003cstrong>Lose flow\u003c/strong>\u003c/span>","type":"paragraph","textAlignment":"center"},"config":{"size":"wide"}},"n-gO1uJi":{"type":"text","data":{"text":"Given that there will be only 5 minutes required for the border crossing, the gravity model simulates the potential Hong Kong-Shenzhen shopping pattern from next year onwards for you by estimating how the rapid clearance duration reshapes the reachable range of Shenzhen commercial areas.","type":"paragraph"},"config":{"size":"wide"}},"n-n3gZ4w":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"themed"},"children":["n-VJObmi","n-lnrHe0","n-gO1uJi"]},"n-j9YglN":{"type":"embed","data":{"url":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/dnoxsc2bv0opo2nhhac2j/keplergl_4vqfwnf.json?rlkey=rygoqzlngo0ymj9b5zx2493mb&dl=0","embedType":"link","title":"Large-scale WebGL-powered Geospatial Data Visualization Tool","description":"Kepler.gl is a powerful web-based geospatial data analysis tool. Built on a high performance rendering engine and designed for large-scale data sets.","thumbnailUrl":"https://d1a3f4spazzrp4.cloudfront.net/kepler.gl/kepler.gl-meta-tag.png","providerUrl":"https://kepler.gl","caption":"Large-scale WebGL-powered Geospatial Data Visualization Tool","isEmbedSupported":true,"display":"inline","embedSrc":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/dnoxsc2bv0opo2nhhac2j/keplergl_4vqfwnf.json?rlkey=rygoqzlngo0ymj9b5zx2493mb&dl=0"}},"n-mFvYi5":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-n3gZ4w","n-j9YglN"]},"n-SmuTMd":{"type":"text","data":{"text":"\u003cspan class=\"sm-text-color-C22E00\">\u003cstrong>Gain flow\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>|\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-00939C\">\u003cstrong>Lose flow\u003c/strong>\u003c/span>","type":"paragraph","textAlignment":"center"},"config":{"size":"wide"}},"n-oiRZbg":{"type":"text","data":{"text":"The &apos;V&apos;-spatial patterns of gain flows intersects Baoan, Nanshan, Futian and Longgang, while a pattern of lose flows emerges towards the north-west regions of Shenzhen. ","type":"paragraph"},"config":{"size":"wide"}},"n-r6a9XX":{"type":"text","data":{"text":"","type":"paragraph"},"config":{"size":"wide"}},"n-xHxCs7":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"themed"},"children":["n-SmuTMd","n-oiRZbg","n-r6a9XX"]},"n-R2Xm8u":{"type":"webmap","data":{"caption":"faeeeeeeeeezzzzzz","map":"r-789c5c7abd154aa9a15913e27fae6e6c","timeSlider":false,"viewPlacement":"extent","mapLayers":[{"id":"19acbdf49df-layer-7","title":"Sketch","visible":true},{"id":"42db00e6e2dc44ccb48ace0fef466dd3","title":"checkpoints","visible":true},{"id":"31f7dc5a8fbd44a8a93b0b4d7520328a","title":"yoooooo_ExportFeatures","visible":true},{"id":"1165fe22b02d44d9bbc7f4d9557896d1","title":"sz_border","visible":true}],"extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":12659762.408244954,"ymin":2565337.7438695496,"xmax":12735435.066247309,"ymax":2607913.1686244095},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12697598.737246132,"y":2586625.4562469795},"zoom":10,"viewpoint":{"rotation":0,"scale":288895.2771445,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12697598.737246132,"y":2586625.4562469795}}}},"n-cSGNQV":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-xHxCs7","n-R2Xm8u"]},"n-7727z1":{"type":"text","data":{"text":"Scenario 2: All ports renovation and land use changes, 2040","type":"h3"},"config":{"size":"wide"}},"n-kwzJZf":{"type":"text","data":{"text":"\u003cspan class=\"sm-text-color-C22E00\">\u003cstrong>Gain flow\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>|\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-00939C\">\u003cstrong>Lose flow\u003c/strong>\u003c/span>","type":"paragraph","textAlignment":"center"},"config":{"size":"wide"}},"n-ucnJJe":{"type":"text","data":{"text":"Let’s say \u003cstrong>all ports\u003c/strong> now take 5 minutes for border crossing. After simulating a change in passenger volume and spatial redistribution of cross-border flow, here, we can see the emerging or overloaded commercial hotspots, which provides direction for future land use planning. ","type":"paragraph"},"config":{"size":"wide"}},"n-48y9w6":{"type":"text","data":{"text":"In our model, we also account for the change in population and land use in both Shenzhen and Hong Kong.","type":"paragraph"},"config":{"size":"wide"}},"n-U343qF":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"themed"},"children":["n-7727z1","n-kwzJZf","n-ucnJJe","n-48y9w6"]},"n-PK8Lxr":{"type":"embed","data":{"url":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/fgg0l2aec3hp9vzpbw1yk/keplergl_msbchy4.json?rlkey=6k8ajk9he4a6gd1dg3ot5vuuq&dl=0","embedType":"link","providerUrl":"https://kepler.gl","isEmbedSupported":true,"display":"inline","embedSrc":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/fgg0l2aec3hp9vzpbw1yk/keplergl_msbchy4.json?rlkey=6k8ajk9he4a6gd1dg3ot5vuuq&dl=0"}},"n-mOmI9E":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-U343qF","n-PK8Lxr"]},"n-WSMDA0":{"type":"text","data":{"text":"\u003cspan class=\"sm-text-color-C22E00\">\u003cstrong>Gain flow\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>|\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-00939C\">\u003cstrong>Lose flow\u003c/strong>\u003c/span>","type":"paragraph","textAlignment":"center"},"config":{"size":"wide"}},"n-5G4U0H":{"type":"text","data":{"text":"Here, the distant districts benefit most from the gain flows due to the quicker clearance times across all ports, while the districts closer to the ports are facing lower flows.","type":"paragraph"},"config":{"size":"wide"}},"n-JR6K7z":{"type":"text","data":{"text":"","type":"paragraph"},"config":{"size":"wide"}},"n-mxZO17":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"themed"},"children":["n-WSMDA0","n-5G4U0H","n-JR6K7z"]},"n-wWe6Ca":{"type":"webmap","data":{"caption":"faeeeeeeeeezzzzzz_2","map":"r-ae3ddf12be8c40fd9d49a1517dbcc13b","timeSlider":false,"viewPlacement":"extent","extent":{"spatialReference":{"latestWkid":3857,"wkid":102100},"xmin":12657269.804855844,"ymin":2559455.0157554564,"xmax":12761664.131844329,"ymax":2618190.0057883714},"center":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12709466.968350086,"y":2588822.510771914},"zoom":9.620448524679976,"viewpoint":{"rotation":0,"scale":398545.9057974926,"targetGeometry":{"spatialReference":{"latestWkid":3857,"wkid":102100},"x":12709466.968350086,"y":2588822.510771914}}}},"n-avin2i":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-mxZO17","n-wWe6Ca"]},"n-ZGC2BC":{"type":"text","data":{"text":"Scenario 3: Instant Inter-city Shopping Network, 2100+","type":"h3"},"config":{"size":"wide"}},"n-y08BBb":{"type":"text","data":{"type":"paragraph","text":"\u003cspan class=\"sm-text-color-4C0035\">\u003cstrong>Higher flow volume\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>|\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>\n\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-FFC300\">\u003cstrong>Lower flow volume\u003c/strong>\u003c/span>","textAlignment":"center"},"config":{"size":"wide"}},"n-myikHb":{"type":"text","data":{"text":"Consider a future where a single trip to Shenzhen grants you seamless access to all its commercial and recreational facilities. This vision is made possible not just by streamlined customs, but by a revolutionary, high-speed trans-boundary transit system. The proposed network extensions into the Northern Metropolis would be the key to enabling this level of deep, metropolitan integration.","type":"paragraph"},"config":{"size":"wide"}},"n-jmhJcg":{"type":"image","data":{"image":"r-2kqZga","isExpandable":false,"caption":"Future Of Transportation?"},"config":{"size":"wide"}},"n-8lpI7z":{"type":"text","data":{"text":"If the transportation costs are negligible, the likely retail agglomerations that would be visited by Hong Kong shoppers in the far future are distributed more evenly across Shenzhen","type":"paragraph"},"config":{"size":"wide"}},"n-qpzYAZ":{"type":"text","data":{"type":"paragraph","text":""},"config":{"size":"wide"}},"n-LXHuji":{"type":"text","data":{"text":"","type":"paragraph"},"config":{"size":"wide"}},"n-BLac58":{"type":"immersive-narrative-panel","data":{"position":"start","size":"small","panelStyle":"themed"},"children":["n-ZGC2BC","n-y08BBb","n-myikHb","n-jmhJcg","n-8lpI7z","n-qpzYAZ","n-LXHuji"]},"n-RIDlOh":{"type":"embed","data":{"url":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/2t8z22ie0gl8oo1xjo32p/keplergl_ww14oh.json?rlkey=y8cfk7t7dv70puetmppttznlm&dl=0","embedType":"link","providerUrl":"https://kepler.gl","isEmbedSupported":true,"display":"inline","embedSrc":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/2t8z22ie0gl8oo1xjo32p/keplergl_ww14oh.json?rlkey=y8cfk7t7dv70puetmppttznlm&dl=0"}},"n-ED4r1t":{"type":"immersive-slide","data":{"transition":"fade"},"children":["n-BLac58","n-RIDlOh"]},"n-drZldo":{"type":"immersive","data":{"type":"sidecar","subtype":"docked-panel","narrativePanelPosition":"start","narrativePanelSize":"medium"},"children":["n-ixuPrU","n-mFvYi5","n-cSGNQV","n-mOmI9E","n-avin2i","n-ED4r1t"]},"n-OIcua1":{"type":"text","data":{"type":"h2","text":"Strategic Recommendations"}},"n-L1tSVp":{"type":"text","data":{"text":"2026+","type":"h3"}},"n-28w8FM":{"type":"text","data":{"type":"paragraph","text":"The first scenario shows that after Huanggang’s redevelopment, its weekly number of cross-border shoppers rises by \u003cstrong>56.1%. \u003c/strong>Additionally\u003cstrong>,\u003c/strong> time saved for those who continue using Lok Ma Chau is \u003cstrong>2153 person-days\u003c/strong> and time saved for users attracted from different ports are \u003cstrong>966 person-days \u003c/strong>\u003cstrong>per week.\u003c/strong>"}},"n-9Hw3wS":{"type":"text","data":{"text":"As such, there is a need to deploy smart-border management for coping with additional demand. Furthermore, the calculated clearance time can be used as manipulative data for the Shenzhen Government to purposefully direct customer flows to specific shopping areas that need to be economically developed.","type":"paragraph"}},"n-GUx0nJ":{"type":"text","data":{"type":"h4","text":"Deploy Smart Border Management &amp; Digital Clearance Tool"}},"n-CpXnmC":{"type":"image","data":{"image":"r-xVDF2n","isExpandable":false,"caption":"West Kowloon Smart Border System "},"config":{"size":"float","floatAlignment":"end"}},"n-7i2lFX":{"type":"text","data":{"type":"paragraph","text":"Objective: To minimise waiting time, balance passenger distribution, and optimise real-time port operations."}},"n-pWeKcQ":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>Inspired by the HKU APP, an APP could be introduced to publish live clearance time APIs in Hong Kong and Shenzhen, and use AI-based demand forecasting to predict morning/evening surges. Travellers could base on the queuing time and make informed decisions by comparing real-time and forecasted clearance times across ports. For example, choosing a port that is geographically farther but faster to cross.\u003c/span>\u003cspan>\u003c/span>"}},"n-RAGXLG":{"type":"text","data":{"text":"Directed Development","type":"h4"}},"n-DQvpRW":{"type":"text","data":{"text":"At the same time, the calculated clearance time can be used as manipulative data for the Shenzhen Government to purposefully direct customer flows to specific shopping areas that need to be economically developed.","type":"paragraph"}},"n-cRCUUq":{"type":"text","data":{"text":"2026 — 2040","type":"h3"}},"n-YqEF9R":{"type":"text","data":{"type":"paragraph","text":"Under Scenario 2 compared to Scenario 1 we identify \u003cstrong>new relatively distant hotspots areas\u003c/strong>, especially those in Baoan district."}},"n-DD5I9p":{"type":"embed","data":{"url":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/p5naldand0dw0i8haqa7y/keplergl_y2gaa9r.json?rlkey=gii7gykmlauavug6zpk1memlm&dl=0","embedType":"link","providerUrl":"https://kepler.gl","isEmbedSupported":true,"display":"inline","embedSrc":"https://kepler.gl/demo/map?mapUrl=https://dl.dropboxusercontent.com/scl/fi/p5naldand0dw0i8haqa7y/keplergl_y2gaa9r.json?rlkey=gii7gykmlauavug6zpk1memlm&dl=0","caption":"\u003cspan class=\"sm-text-color-C22E00\">\u003cstrong>Gain flow in 2026-2040\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>   \u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-000000\">\u003cstrong>|\u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-d21515\">\u003cstrong>   \u003c/strong>\u003c/span>\u003cspan class=\"sm-text-color-00939C\">\u003cstrong>Lose flow in 2026-2040\u003c/strong>\u003c/span>"}},"n-7u3ZTL":{"type":"text","data":{"text":"Co-planning framework by Shenzhen and Hong Kong","type":"h4"}},"n-dE1R4w":{"type":"text","data":{"type":"paragraph","text":"Objective: To coordinate the regional master plan by Shenzhen and Hong Kong around the area of a cross-border conurbation in 2026 - 2040."}},"n-e96COS":{"type":"text","data":{"type":"paragraph","text":"Inspired by the Oresund Region, where the area is a cross-border conurbation by Denmark and Sweden, enhancing innovation cooperation through knowledge complementarity, expanding the labour market, and promoting coordinated development of cross-border transport and infrastructure (OECD, 2025), the Shenzhen–Hong Kong border region could similarly evolve from a functional boundary into a collaborative economic zone. Applying this idea, both local governments could jointly together and develop a regional master plan within the boundary of the Gain flow districts."}},"n-THTv63":{"type":"image","data":{"image":"r-SyJsq6","isExpandable":false,"caption":"Singapore&apos;s 2030+ Vertical Plan"},"config":{"size":"float","floatAlignment":"end"}},"n-qJzAap":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>However, due to different spatial and urban conditions on each side, the planning approach should not be identical. As shown in the figure, there are significant differences in urban development conditions between Hong Kong and Shenzhen, where Shenzhen has existing urban buildings and limited vacant land, whereas Hong Kong has undeveloped land. The cross-border plan could adopt different spatial planning strategies on each side of the border. Inspired by Singapore’s 2030+ Vertical plan (Wordpress.com, 2013), Shenzhen could apply the idea of “Vertical Plan”, which focuses on the renewal and reconfiguration of existing buildings, with each floor having a specific function, driving urban and lifestyle transformation and creating liveable cities and economic value. In contrast, it would be more appropriate for Hong Kong to have a horizontal plan, which means the plan for the land uses on the identified potential development areas shown in the figure.\u003c/span>"}},"n-b2M5ur":{"type":"text","data":{"text":"Retail Positioning ","type":"h4"}},"n-5IA09t":{"type":"text","data":{"text":"Objective: To enhance user experience and maximise commercial economic returns.","type":"paragraph"}},"n-t27xD8":{"type":"image","data":{"image":"r-a3nEYA","isExpandable":false,"caption":"Future Of Retail Commercial Zones"},"config":{"size":"float","floatAlignment":"end"}},"n-dylAlK":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>For individual businesses and developers, the redevelopment of Huanggang Port would lead to expected changes in the demographics of cross-border travellers. New and existing commercial areas should be designed to meet the specific needs of identified key visitors by tailoring retail planning, facility design, and tenant composition to families, young-aged visitors, and other key traveller groups. For example, if more travellers are visiting as families, new commercial areas should consider the needs of both adults and children. This may include family-friendly facilities such as children's play areas, stroller-friendly access, family dining areas, and shared leisure spaces. Further adjusting the tenant mix in response to evolving demand patterns is appropriate.\u003c/span>"}},"n-gzHRqB":{"type":"text","data":{"type":"h2","text":"Limitations &amp; Future Research"}},"n-Re7Ryn":{"type":"text","data":{"text":"Despite the fantastic insights from the gravity model and scenario simulations, several limitations should be acknowledged in the interpretation of results.","type":"paragraph"}},"n-ruPLXx":{"type":"text","data":{"text":"Limited Data","type":"h3"}},"n-jNcOzw":{"type":"text","data":{"text":"Limited sample of mobility data","type":"h4"}},"n-VAdOGq":{"type":"text","data":{"text":"The mobility data covers only one week of cross-border movement and does not capture seasonal patterns, peak shopping periods, such as holidays and sales seasons, or long-term behavioural adaptations, which would result in uncertainty of the actual retail footfall.","type":"paragraph"}},"n-j6QAaZ":{"type":"text","data":{"text":"Limitations of shopper identification","type":"h4"}},"n-MLDGhP":{"type":"text","data":{"type":"paragraph","text":"The identification of “shoppers” relies on mobile positioning data, the measurement assumption that individuals are considered active shoppers when they spend over 1.5 hours cumulatively within a retail area. Thus, the secondary activities, which include the shopping purpose and the non-shopping behaviours that occurred nearby, are not noticed and misunderstood. "}},"n-LAE5ck":{"type":"text","data":{"text":"Limited sample representativeness","type":"h4"}},"n-TxUeSj":{"type":"text","data":{"text":"The analysis relies on a subset of individuals rather than a comprehensive population sample. This introduces potential sampling bias and reduces the robustness of the model. A larger and more heterogeneous dataset with diversified sources, such as data from social media and first-hand data collected in person, would likely reduce the root mean square error (RMSE) and improve predictive accuracy.","type":"paragraph"}},"n-VyWBqX":{"type":"text","data":{"text":"Limited Methodology ","type":"h3"}},"n-76zfzr":{"type":"text","data":{"text":"Simplified attractiveness and travel cost approximations","type":"h4"}},"n-CH00RK":{"type":"text","data":{"text":"The Attractiveness was modelled by limited geospatial proxies, and travel costs were approximated rather than measured directly, overlooking critical factors such as brand diversity, cultural preferences, or real-time congestion, which influence shopping decisions.","type":"paragraph"}},"n-0UxRvC":{"type":"text","data":{"text":"Data limitations for model calibration","type":"h4"}},"n-W7wkF8":{"type":"text","data":{"text":"The limited training parameters and constrained datasets restrict the ability to fully capture complex interactions between cross-border mobility, retail attractiveness, and transport accessibility.","type":"paragraph"}},"n-YEXzBH":{"type":"text","data":{"type":"h2","text":"References"}},"n-fmaE22":{"type":"text","data":{"text":"Dolega, L., Pavlis, M., &amp; Singleton, A. (2016). Estimating attractiveness, hierarchy and catchment area extents for a national set of retail centre agglomerations. Journal of Retailing and Consumer Services, 28, 78–90. \u003ca href=\"https://doi.org/10.1016/j.jretconser.2015.08.013\" rel=\"noopener noreferrer\" target=\"_blank\">https://doi.org/10.1016/j.jretconser.2015.08.013\u003c/a>","type":"paragraph"}},"n-w6057x":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>OECD. (2025). The case of Oresund (Denmark-Sweden) – Regions and Innovation: Collaborating Across Borders. [online] Available at: \u003c/span>\u003ca href=\"https://www.oecd.org/en/publications/the-case-of-oresund-denmark-sweden-regions-and-innovation-collaborating-across-borders_5k3xv0lk8knn-en.html\">\u003cspan>https://www.oecd.org/en/publications/the-case-of-oresund-denmark-sweden-regions-and-innovation-collaborating-across-borders_5k3xv0lk8knn-en.html\u003c/span>\u003c/a>\u003cspan>.&nbsp;\u003c/span>"}},"n-q9xP35":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>Oppewal, H., &amp; Koelemeijer, K. (2005). More choice is better: Effects of assortment size and composition on assortment evaluation. \u003c/span>\u003cspan>International Journal of Research in Marketing\u003c/span>\u003cspan>, \u003c/span>\u003cspan>22\u003c/span>\u003cspan>(1), 45–60. \u003c/span>\u003ca href=\"https://doi.org/10.1016/j.ijresmar.2004.03.002\">\u003cspan>https://doi.org/10.1016/j.ijresmar.2004.03.002\u003c/span>\u003c/a>\u003cspan>&nbsp;\u003c/span>"}},"n-Bk1TwA":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>Reilly, W. J.-. (1931). \u003c/span>\u003cspan>The law of retail gravitation, by William J. Reilly\u003c/span>\u003cspan>. W.J. Reilly, c1931.\u003c/span>"}},"n-eMGYIU":{"type":"text","data":{"type":"paragraph","text":"s.Kong (2023). 高鐵復開｜西九龍站大升級　自助入閘五秒搞掂. [online] Orangenews.hk. Available at: \u003ca href=\"https://www.orangenews.hk/hongkong/1168728/%E9%AB%98%E9%90%B5%E5%BE%A9%E9%96%8B-%E8%A5%BF%E4%B9%9D%E9%BE%8D%E7%AB%99%E5%A4%A7%E5%8D%87%E7%B4%9A-%E8%87%AA%E5%8A%A9%E5%85%A5%E9%96%98%E4%BA%94%E7%A7%92%E6%90%9E%E6%8E%82.shtml\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.orangenews.hk/hongkong/1168728/%E9%AB%98%E9%90%B5%E5%BE%A9%E9%96%8B-%E8%A5%BF%E4%B9%9D%E9%BE%8D%E7%AB%99%E5%A4%A7%E5%8D%87%E7%B4%9A-%E8%87%AA%E5%8A%A9%E5%85%A5%E9%96%98%E4%BA%94%E7%A7%92%E6%90%9E%E6%8E%82.shtml\u003c/a> "}},"n-TuT2jM":{"type":"text","data":{"type":"paragraph","text":"\u003cspan>Teller, C., &amp; Reutterer, T. (2008). The evolving concept of retail attractiveness: What makes retail agglomerations attractive when customers shop at them? \u003c/span>\u003cspan>Journal of Retailing and Consumer Services\u003c/span>\u003cspan>, \u003c/span>\u003cspan>15\u003c/span>\u003cspan>(3), 127–143. \u003c/span>\u003ca href=\"https://doi.org/10.1016/j.jre lide3.title":"Publish and share","builder.template.onboarding.slide3.text":"Templates are published and shared just like stories. A private template is accessible only to you and administrators in your organization, while a public template can be used by anyone.","viewer.convertAndUploadMedia.inlineMessage":"Uploading","viewer.convertMedia.inlineMessage":"Converting","viewer.convertAndUploadMedia.loading":"Loading","viewer.swipe.handle.ariaLabel":"Compare media by using the left and right arrow keys","viewer.swipe.map.placeholder.map1":"Map 1","viewer.swipe.map.placeholder.map2":"Map 2","viewer.tour.data.category.noTitle":"Untitled category","viewer.tour.skipTour":"Skip tour","component.storyLogo.default.altText":"Story logo","component.themePreviewSampleFrame.title":"Frame title","component.themePreviewSampleFrame.title.description":"Use this sample frame to preview your theme","component.themePreviewSample.text":"Text blocks","component.themePreviewSampleFrame.text.description":"Headings, like the one above, use the title font.\n\nParagraphs (and lists) use the paragraph font. Here is text formatted using \u003cspan class=\"sm-text-color-themeColor1\">\u003cstrong>accent color 1\u003c/strong>\u003c/span>, \u003cspan class=\"sm-text-color-themeColor2\">\u003cstrong>accent color 2\u003c/strong>\u003c/span>, \u003cspan class=\"sm-text-color-themeColor3\">\u003cstrong>accent color 3\u003c/strong>\u003c/span>, and the theme’s \u003ca href=\"#link-style\" rel=\"noopener noreferrer\" target=\"_blank\">link style\u003c/a>.\n\nSlides use the theme background color.","component.themePreviewSampleBriefing.text.description":"The slide title and headings, above, use the title and headings font. Paragraphs (and lists) use the paragraph font. Here is text formatted using \u003cspan class=\"sm-text-color-themeColor1\">\u003cstrong>accent color 1\u003c/strong>\u003c/span>, \u003cspan class=\"sm-text-color-themeColor2\">\u003cstrong>accent color 2\u003c/strong>\u003c/span>, \u003cspan class=\"sm-text-color-themeColor3\">\u003cstrong>accent color 3\u003c/strong>\u003c/span>, and the theme’s \u003ca href=\"#link-style\" rel=\"noopener noreferrer\" target=\"_blank\">link style\u003c/a>.","component.themePreviewSampleFrame.description":"This example frame includes content blocks like text, charts, buttons, and more.","component.themePreviewSampleFrame.buttons":"Buttons use the \u003cspan class=\"sm-text-color-themeColor1\">\u003cstrong>accent color\u003c/strong>\u003c/span> and paragraph font with white or black text, or you can design your own custom style.","component.themePreviewSampleFrame.buttons.text":"Buttons","component.themePreviewSampleFrame.infographics":"Infographics","component.themePreviewSampleFrame.infographics.description":"Infographics use the \u003cspan class=\"sm-text-color-themeColor1\">\u003cstrong>accent color\u003c/strong>\u003c/span> for the icon and number and the theme title font for the description.","component.themePreviewSampleFrame.infographic.number":"10","component.themePreviewSampleFrame.infographic.description":"Mountain peaks","component.themePreviewSampleFrame.maps.description":"Express maps and map tours use the \u003cspan class=\"sm-text-color-themeColor1\">\u003cstrong>accent color\u003c/strong>\u003c/span> for symbols, theme fonts in pop-ups, and the theme basemap.","component.themePreviewSampleBriefing.expressMap.description":"Express maps use the \u003cspan class=\"sm-text-color-themeColor1\">\u003cstrong>accent color\u003c/strong>\u003c/span> for symbols, theme fonts in pop-ups, and the theme basemap.","component.themePreviewSampleStory.header":"You can edit this header style in Theme Colors","component.themePreviewSampleStory.cover.title":"Story title","component.themePreviewSampleCollection.cover.title":"Collection title","component.themePreviewSampleStory.cover.summary":"Use this sample story to preview your custom theme. As you modify colors, typography, and more, those changes will be reflected here.","component.themePreviewSampleCollection.cover.summary":"Use this sample collection to preview your theme","component.themePreviewSampleBriefing.cover.summary":"Use this sample briefing to preview your theme","component.themePreviewSampleCollection.bodyText1":"This is the collection description. It uses the paragraph font. Here is text formatted with \u003cspan class=\"sm-text-color-themeColor1\">accent color 1\u003c/span>, \u003cspan class=\"sm-text-color-themeColor2\">accent color 2,\u003c/span> and \u003cspan class=\"sm-text-color-themeColor3\">accent color 3\u003c/span>, and the theme’s \u003ca href=\"#link-style\" rel=\"noopener noreferrer\" target=\"_blank\">link style\u003c/a>.","component.themePreviewSampleCollection.item.title":"Item title","component.themePreviewSampleCollection.item.exampleTitle1":"Sample item 1","component.themePreviewSampleCollection.item.exampleTitle2":"Sample item 2","component.themePreviewSampleCollection.item.label1":"Redlands, California","component.themePreviewSampleCollection.item.label2":"Toronto, Canada","component.themePreviewSampleCollection.item.locationLabel":"If you set a location for an item, it can be shown in the collection overview map","component.themePreviewSampleStory.navigation.credits":"Credits","component.themePreviewSampleStory.bodyText1":"This story includes several of the pieces you might use in your own story like paragraphs, buttons, separators, and more. To get started, expand a section of the styling panel and make some adjustments. As you make changes, you’ll see this story demonstrate how they look. For example, try changing the background color and observe how the story and the navigation bar (above) change.","component.themePreviewSampleStory.bodyText2":"Next, try changing the paragraph font, and see what happens to this text. Then, try adjusting the quote style and alignment to see how your choices affect the quote below. You’ll also notice that a quote uses the paragraph font for its text.","component.themePreviewSampleStory.bodyText3":"You can style your paragraph text to use \u003cstrong>bold\u003c/strong>, \u003cem>italics\u003c/em>, and \u003cem>\u003cstrong>bold italics\u003c/strong>\u003c/em>, so you can emphasize important text accordingly. These come pre-packaged with the fonts you’ve chosen, so there’s nothing extra you need to configure.","component.themePreviewSampleStory.bodyText4":"If you add an express map or map tour to your story, the features will initially use the \u003cspan class=\"sm-text-color-themeColor1\">accent color\u003c/span> (but you can style them with a different accent color or any color you like).","component.themePreviewSampleStory.bodyText5":"Data series are represented using theme accent colors and the paragraph font. Chart and axis titles use the title font.","component.themePreviewSampleStory.bodyText7":"Your theme’s secondary background color is used for content elements including table heading rows and the credits section (below). Tables use the paragraph color and font; the header row uses bold paragraph style.","component.themePreviewSampleStory.bodyText8":"You have a few different options for separator styles; toggle between them and see how the separator below changes. Your theme’s \u003cspan class=\"sm-text-color-themeColor1\">accent color\u003c/span> is used in separators, quotes, buttons, and links (unless you override it).","component.themePreviewSampleStory.bodyText9":"Wondering what embed cards look like? Check out the one below!","component.themePreviewSampleStory.sectionHeadingH2.basicBlocks":"Basic blocks","component.themePreviewSampleStory.sectionHeadingH2.contentBlocks":"Media","component.themePreviewSampleStory.sectionHeadingH2.dataVisualization":"Data visualization","component.themePreviewSampleStory.button.text":"This is a button","component.themePreviewSampleCollection.button.text":"Button style","component.themePreviewSampleStory.quote":"Quotes use the theme’s title font, but you can also choose one f your favorite collections will live here for quick and easy access","component.myCollections.builder.add":"Add to collection","component.myCollections.builder.empty":"This collection is empty","component.myCollections.builder.fullMessage":"Collections can include up to 60 items. You’ll need to remove some before you can add any new ones.","component.myCollections.builder.removeCollection":"Remove from collection","component.collections.builder.hideCollectionItem":"Hide item","component.collections.builder.showCollectionItem":"Show item","component.myCollections.builder.editDetails":"Edit details","component.myStories.index.quickStart.explorerMapTour.title":"Explorer map tour","component.myStories.index.quickStart.explorerMapTour.description":"Readers explore a curated set of places in whatever order they choose","component.myStories.index.quickStart.explorerMapTour.alt":"An explorer map tour with a list of places on one side and a map of those locations on the other","component.myContent.allContent":"All content","component.myContent.allStatuses":"All statuses","component.myContent.viewItemsIn":"View items in","component.myContent.contentType":"Content type","component.myContent.publishStatus":"Publish status","component.myContent.filters":"Filters","component.myContent.allSharing":"All sharing","component.myContent.sort":"Sort","common.createDropdown.onboarding.modal.p1.title":"What is ArcGIS StoryMaps?","common.createDropdown.onboarding.modal.p1.content.first":"ArcGIS StoryMaps is the next-generation multimedia storytelling tool that enables you to combine maps and apps with a variety of media to tell a story. It offers four content formats built for different purposes: stories, briefings, frames, and collections. Additionally, themes and templates capture your design and storytelling patterns to help you create new, high-quality content quickly.","common.createDropdown.onboarding.modal.p1.content.second":"Click through this short tutorial to learn about each type of item you can create with ArcGIS StoryMaps.","common.createDropdown.onboarding.modal.p1.content.third":"Explore examples of all content types in the \u003clink>ArcGIS StoryMaps gallery\u003c/link>","common.createDropdown.onboarding.modal.p2.content.first":"Stories are narratives that look and behave like an article or blog. They can feature immersive sections, which are media-centric, interactive viewing experiences. You can choreograph the movement of maps and media in an immersive section to create an engaging experience for readers.","common.createDropdown.onboarding.modal.p2.content.second":"All types of StoryMaps are created using an intuitive builder that makes it easy to integrate media, maps, apps, and content from the web. You can even create simple maps directly in the builder to highlight locations of interest.","common.createDropdown.onboarding.modal.p3.content.first":"Briefings are a slide-based format designed for delivering live presentations and succinct information sharing. You build briefing slides using flexible content blocks to add maps, apps, and media.","common.createDropdown.onboarding.modal.p3.content.second":"A briefing can be shared as a web link or viewed through the ArcGIS StoryMaps Briefings app. The briefings app is especially useful for executives and field workers who need offline access to briefings when they don’t have a reliable connection.","common.createDropdown.onboarding.modal.p4.content":"Frames are a mobile-first output ideal for shorter-form storytelling and information sharing. Common uses for frames include a promotional teaser, event announcement, or hand-held digital tour. They are designed to be viewed on phones and shared on social media platforms for greater reach.","common.createDropdown.onboarding.modal.p5.content.first":"Collections are a set of related content assembled in a portfolio-like viewing experience. You can add stories, briefings, and frames to a collection and include supporting content like apps, PDFs, and media. A collection can also present items on a map for geographic exploration.","common.createDropdown.onboarding.modal.p5.content.second":"You can use collections to group stories around a topic or share content with a specific audience. Put a collection on autoplay at a conference or on a lobby display monitor to attract attendees or show off your organization’s work.","common.createDropdown.onboarding.modal.p6.content.first":"Themes capture the look and feel of your content. You define colors, fonts, and styles for elements such as buttons, quotes, and section separators. Once you’ve built a custom theme, you can apply it to any content you’ve created with ArcGIS StoryMaps.","common.createDropdown.onboarding.modal.p6.content.second":"If you’re looking for inspiration, an AI assistant can generate suggested starting points for a new theme based on a description or image, or you can simply choose from a selection of ready-to-use, professionally designed themes.","common.createDropdown.onboarding.modal.p7.content.first":"Templates are a special kind of story that others can copy and build upon. They can be used to serve as a starting point for periodic reports, class assignments, or a set of similar stories about different places.","common.createDropdown.onboarding.modal.p7.content.second":"The template builder is identical to the story builder, with the addition of an Instructions block that allows you to provide directions to anyone building upon that template. You can build a template from scratch or create a template version of a story you’ve already put together.","common.createDropdown.onboarding.modal.p8.title":"Learn more and get inspired","common.createDropdown.onboarding.modal.p8.content.first":"Visit the \u003clink>ArcGIS StoryMaps blog\u003c/link> to learn the basics of storytelling and tips to make your content more effective and engaging.","common.createDropdown.onboarding.modal.p8.content.second":"Also be sure to explore the \u003clink>ArcGIS StoryMaps gallery\u003c/link>. It is a great place to get inspired by many exemplary examples of stories, briefings, frames, collections, templates, and themes created by the vibrant, diverse storytelling community.","common.banner.storyMapperContest.shortTitle":"Enter the 2026 ArcGIS StoryMaps Competition","common.banner.storyMapperContest.description":"Show how maps make your community better. Submit your story by December 11.","component.socialSharing.linkSuccess":"Success","component.storyCreator.creating":"Launching story builder","component.briefingCreator.creating":"Launching briefing builder","component.storyEditor.saveErrorTitle":"Sorry!","component.storyEditor.saveErrorDetails":"There was a problem saving your story","component.themeCreator.launchingThemeBuilder":"Launching theme builder","component.theme.confirmDelete.alt":"Are you sure you want to delete this theme? This cannot be undone.","component.themes.empty.noThemesTitle":"Create your first theme","component.themes.empty.noThemesDesc":"Capture a set of fonts, colors, and styles to reuse and share with others","component.themes.empty.noFavesTitle":"Your favorite themes will appear here","component.themes.empty.noFavesDesc":"All of your favorite themes will live here for quick and easy access","component.themes.index.searchLabel":"Search themes","component.themes.themes":"Themes","component.themes.themes.beta":"Themes (beta)","component.themes.itemCard.title":"Theme (Untitled)","component.themes.myThemes":"My Themes","component.themes.confirmDelete.button":"Delete theme and apply {defaultTheme}","component.themes.deleteModal.theme":"Delete theme?","component.themes.confirmDelete":"If you delete this theme, the items listed below will automatically adopt the {defaultTheme} theme","component.themes.confirmDelete.publishedCount":"Published items {publishedCount}","component.themes.confirmDelete.draftCount":"Draft items {publishedCount}","component.themes.dropdown.startStory":"Start a new story","com (function () {

      resource.data = {...resource.data, provider:'uri',src:local('data/assets/'+encodeURIComponent(resource.data.resourceId))};
      delete resource.data.resourceId;
    }
  }
  const datasets = ['n-sPxYJA','n-j9YglN','n-PK8Lxr','n-RIDlOh','n-DD5I9p'];
  let index = 0;
  for (const [id,node] of Object.entries(story.nodes)) {

    const requested = new URL(typeof input === 'string' || input instanceof URL ? input : input.url,location.href);
    if(hkService.matches(requested.href))return hkService.handle(requested.href,input,options);
